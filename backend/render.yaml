databases:
  - name: agriride-db
    databaseName: agriridedb
    user: agriride_user
    plan: free

services:
  - type: web
    name: agriride-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn agriride.wsgi:application"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agriride-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
